baseURL = "https://glalonde.github.io/cinnastyx/"
title = "Cinnastyx"
theme = "cinnastyx"
# This is only to get exampleSite to work from within the theme directory, remove it if you're using a standard site layout.
themesdir = "../.."
copyright = ""

locale = "en-US"
enableRobotsTXT = true

[params]
  scheme = "dark" # light, dark, gray or preference
  description = "Reporting Live"
  logo = "mvq.jpg"

[menu]
  [[menu.main]]
    name = "Feed"
    url = "/index.xml"
  [[menu.main]]
    name = "About"
    url = "/about"

[pagination]
  pagerSize = 5

[markup.highlight]
  style = "solarized-dark"

# Content in this repository is trusted and includes HTML examples.
[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["\\[", "\\]"], ["$$", "$$"]]
    inline = [["\\(", "\\)"]]
